<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUNMILL // Retro 3D Grid Runner</title>
  <meta name="description" content="A neon-lit 3D 8-bit cyber-grid retro runner game. Avoid obstacles, collect floppy disks, and dominate the leaderboard!">
  <!-- Retro arcade style fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-CEwzuqE7.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-oB_G2ivm.css">
</head>
<body>
  <!-- CRT Screen Effect Layer -->
  <div class="crt-overlay"></div>
  
  <div id="game-container">
    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- HUD (Heads-Up Display) -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-item neon-cyan">
          <span class="label">SCORE</span>
          <span id="hud-score" class="value">00000</span>
        </div>
        <div class="hud-item neon-yellow">
          <span class="label">SPEED</span>
          <span id="hud-speed" class="value">0</span><span class="unit"> km/h</span>
        </div>
        <div class="hud-item neon-pink">
          <span class="label">HP</span>
          <div id="hud-lives" class="lives-container">
            <div class="heart active"></div>
            <div class="heart active"></div>
            <div class="heart active"></div>
          </div>
        </div>
      </div>
      <div class="hud-bottom">
        <div class="hud-item neon-cyan">
          <span class="label">DISTANCE</span>
          <span id="hud-distance" class="value">0</span><span class="unit"> m</span>
        </div>
        <div id="hud-multiplier-container" class="hud-item neon-purple hidden">
          <span class="label">MULT</span>
          <span id="hud-multiplier" class="value">x1</span>
        </div>
      </div>
    </div>

    <!-- START SCREEN OVERLAY -->
    <div id="start-screen" class="overlay-panel">
      <div class="retro-box">
        <h1 class="game-title text-flicker">RUNMILL</h1>
        <p class="game-subtitle">CYBER GRID RUNNER v1.0.0</p>
        
        <div class="menu-section">
          <button id="start-btn" class="retro-btn neon-pink-glow">RUN PROGRAM</button>
        </div>

        <div class="instructions-section">
          <h3>CONTROLS:</h3>
          <p>← / A : MOVE LEFT</p>
          <p>→ / D : MOVE RIGHT</p>
          <p>SPACE / W : JUMP</p>
        </div>

        <div class="leaderboard-section">
          <h3>TOP RUNNERS</h3>
          <ol id="leaderboard-list">
            <li class="loading">RETRIEVING DATA...</li>
          </ol>
        </div>
      </div>
    </div>

    <!-- GAME OVER SCREEN OVERLAY -->
    <div id="game-over-screen" class="overlay-panel hidden">
      <div class="retro-box game-over-box">
        <h2 class="game-over-title text-glitch">CONNECTION LOST</h2>
        <p class="game-subtitle">SESSION TERMINATED</p>
        
        <div class="stats-summary">
          <p>FINAL SCORE: <span id="final-score" class="neon-cyan">0</span></p>
          <p>DISTANCE: <span id="final-distance" class="neon-yellow">0</span>m</p>
        </div>

        <!-- Submit High Score Form -->
        <div id="high-score-form" class="hidden">
          <p class="neon-pink">NEW HIGH SCORE UNLOCKED!</p>
          <div class="form-group">
            <input type="text" id="player-name" placeholder="ENTER INITIALS" maxlength="3" autofocus>
            <button id="submit-score-btn" class="retro-btn btn-sm neon-cyan-glow">UPLOAD</button>
          </div>
        </div>

        <div class="menu-section">
          <button id="restart-btn" class="retro-btn neon-pink-glow">REBOOT RUN</button>
        </div>
      </div>
    </div>

    <!-- Touch Controls for Mobile Devices -->
    <div id="touch-controls" class="hidden">
      <button id="touch-left" class="touch-btn">←</button>
      <button id="touch-jump" class="touch-btn">JUMP</button>
      <button id="touch-right" class="touch-btn">→</button>
    </div>
  </div>

</body>
</html>
